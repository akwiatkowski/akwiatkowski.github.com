<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f5f5f5;
        color: #333;
    }

    .container {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 16px;
        padding: 16px;
        min-height: 100vh;
    }

    .sidebar {
        background: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        overflow-y: auto;
        max-height: calc(100vh - 32px);
    }

    .sidebar h2 {
        font-size: 18px;
        margin-bottom: 16px;
        color: #1a1a1a;
    }

    .sidebar h3 {
        font-size: 14px;
        font-weight: 600;
        margin-top: 16px;
        margin-bottom: 12px;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .filter-group {
        margin-bottom: 16px;
    }

    .radio-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .radio-item {
        display: flex;
        align-items: center;
        cursor: pointer;
    }

    .radio-item input[type="radio"] {
        margin-right: 8px;
        cursor: pointer;
    }

    .radio-item label {
        cursor: pointer;
        font-size: 14px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #2196F3;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 12px;
    }

    button:hover {
        background: #1976D2;
    }

    button:active {
        background: #1565C0;
    }

    button:disabled {
        background: #ccc;
        cursor: not-allowed;
    }

    #map {
        width: 100%;
        height: 100%;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .map-container {
        background: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        height: calc(100vh - 32px);
    }

    .results {
        margin-top: 16px;
        padding: 12px;
        background: #f9f9f9;
        border-radius: 6px;
        font-size: 13px;
        border-left: 4px solid #2196F3;
    }

    .results p {
        margin: 4px 0;
    }

    .route-popup {
        font-size: 12px;
    }

    .route-popup h4 {
        font-size: 13px;
        margin-bottom: 8px;
        color: #1a1a1a;
    }

    .route-popup p {
        margin: 4px 0;
        color: #555;
    }

    .export-links {
        margin-top: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .export-link {
        display: inline-block;
        padding: 6px 12px;
        background: #4CAF50;
        color: white;
        text-decoration: none;
        border-radius: 4px;
        font-size: 11px;
        text-align: center;
        cursor: pointer;
        transition: background 0.2s;
    }

    .export-link:hover {
        background: #45a049;
    }

    .loading {
        text-align: center;
        padding: 20px;
        color: #999;
    }

    .error {
        background: #ffebee;
        color: #c62828;
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 12px;
        border-left: 4px solid #c62828;
        font-size: 13px;
    }

    .legend {
        background: white;
        padding: 12px;
        border-radius: 6px;
        font-size: 12px;
        margin-top: 12px;
    }

    .legend-item {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
    }

    .legend-color {
        width: 20px;
        height: 20px;
        margin-right: 8px;
        border-radius: 3px;
    }

    .stats {
        font-size: 12px;
        margin-top: 8px;
        padding: 8px;
        background: white;
        border-radius: 4px;
        border-left: 3px solid #ff9800;
    }

    .stats p {
        margin: 2px 0;
    }
</style>
