<tr class="{{ season_class }}">
  <td>{{ month }}</td>
  <td class="text-end">{{ month.distance }} km</td>
  <td class="text-end">{{ month.distance_bicycle }} km</td>
  <td class="text-end">{{ month.distance_hike }} km</td>
  <td class="text-end">{{ month.time_spent }} h</td>
  <td class="ys-bar-cell">{{ month.bar_svg }}</td>
</tr>
