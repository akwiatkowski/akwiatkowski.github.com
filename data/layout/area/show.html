<style>
    /* ==================== HERO MAP SECTION ==================== */
    .hero-map-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 1;
        transition: opacity 0.3s ease;
    }

    #map {
        width: 100%;
        height: 100%;
    }

    /* Hide Leaflet attribution in hero */
    .hero-map-container .leaflet-control-attribution {
        display: none;
    }

    .hero-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(
            to bottom,
            rgba(0,0,0,0.1) 0%,
            rgba(0,0,0,0.3) 50%,
            rgba(0,0,0,0.6) 100%
        );
        pointer-events: none;
        transition: opacity 0.3s ease;
    }

    .hero-content {
        text-align: center;
        color: white;
        text-shadow: 0 2px 20px rgba(0,0,0,0.5);
    }

    .area-type-badge {
        display: inline-block;
        padding: var(--space-6) var(--space-16);
        background: var(--color-primary);
        color: var(--color-btn-primary-text);
        font-size: var(--font-size-xs);
        font-weight: var(--font-weight-semibold);
        text-transform: uppercase;
        letter-spacing: 2px;
        border-radius: var(--radius-full);
        margin-bottom: var(--space-16);
        text-shadow: none;
    }

    .area-name {
        font-family: var(--font-family-base);
        font-size: clamp(3rem, 10vw, 6rem);
        font-weight: var(--font-weight-bold);
        margin-bottom: var(--space-8);
        line-height: var(--line-height-tight);
    }

    .area-parent {
        font-size: var(--font-size-xl);
        opacity: 0.9;
        margin-bottom: var(--space-24);
    }

    .area-parent a {
        color: white;
        text-decoration: none;
        border-bottom: 1px solid rgba(255,255,255,0.5);
        transition: border-color var(--duration-fast);
    }

    .area-parent a:hover {
        border-color: white;
    }

    .hero-stats-preview {
        display: flex;
        gap: var(--space-32);
        margin-top: var(--space-24);
    }

    .hero-stat {
        text-align: center;
    }

    .hero-stat-value {
        font-size: var(--font-size-4xl);
        font-weight: var(--font-weight-bold);
    }

    .hero-stat-label {
        font-size: var(--font-size-sm);
        opacity: 0.8;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .scroll-hint {
        position: fixed;
        bottom: var(--space-32);
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        color: white;
        text-align: center;
        animation: bounce 2s infinite;
        pointer-events: none;
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
        40% { transform: translateX(-50%) translateY(-10px); }
        60% { transform: translateX(-50%) translateY(-5px); }
    }

    /* ==================== MAIN CONTENT ==================== */
    .main-content {
        position: relative;
        z-index: 10;
        margin-top: 100vh;
        background: var(--color-background);
    }

    .content-transition {
        height: 100px;
        background: linear-gradient(to bottom, transparent, var(--color-background));
        margin-top: -100px;
        position: relative;
        z-index: 10;
    }

    .section {
        padding: 80px var(--space-24);
        max-width: 1200px;
        margin: 0 auto;
    }

    .section-title {
        font-family: var(--font-family-base);
        font-size: var(--font-size-3xl);
        font-weight: var(--font-weight-bold);
        margin-bottom: 48px;
        text-align: center;
        color: var(--color-text);
    }

    /* ==================== STATS SECTION ==================== */
    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: var(--space-24);
        margin-bottom: 48px;
    }

    .stat-card {
        background: var(--color-surface);
        padding: var(--space-32);
        border-radius: var(--radius-lg);
        text-align: center;
        border: 1px solid var(--color-card-border);
        transition: border-color var(--duration-normal) var(--ease-standard),
                    box-shadow var(--duration-normal) var(--ease-standard);
    }

    .stat-card:hover {
        border-color: var(--color-primary);
        box-shadow: 0 0 10px 2px rgba(var(--color-teal-500-rgb), 0.3);
    }

    .stat-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto var(--space-16);
        background: var(--color-primary);
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--color-btn-primary-text);
        font-size: var(--font-size-xl);
    }

    .stat-value {
        font-size: var(--font-size-4xl);
        font-weight: var(--font-weight-bold);
        color: var(--color-primary);
        line-height: 1;
        margin-bottom: var(--space-8);
    }

    .stat-label {
        color: var(--color-text-secondary);
        font-size: var(--font-size-sm);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .stat-breakdown {
        margin-top: var(--space-12);
        padding-top: var(--space-12);
        border-top: 1px solid var(--color-card-border);
        font-size: var(--font-size-sm);
        color: var(--color-text-secondary);
        line-height: 1.6;
    }

    /* ==================== NAV LINKS ==================== */
    .nav-links {
        display: flex;
        justify-content: center;
        gap: var(--space-16);
        margin-top: 48px;
        flex-wrap: wrap;
    }

    .nav-link-btn {
        display: inline-flex;
        align-items: center;
        gap: var(--space-8);
        padding: var(--space-12) var(--space-24);
        background: var(--color-primary);
        color: var(--color-btn-primary-text);
        text-decoration: none;
        border-radius: var(--radius-full);
        font-weight: var(--font-weight-medium);
        font-size: var(--font-size-base);
        transition: background var(--duration-fast), transform var(--duration-fast);
    }

    .nav-link-btn:hover {
        background: var(--color-primary-hover);
        transform: translateY(-2px);
        color: var(--color-btn-primary-text);
        text-decoration: none;
    }

    .nav-link-btn.secondary {
        background: transparent;
        border: 2px solid var(--color-primary);
        color: var(--color-primary);
    }

    .nav-link-btn.secondary:hover {
        background: var(--color-primary);
        color: var(--color-btn-primary-text);
    }

    /* ==================== PHOTOS SECTION ==================== */
    .photos-section {
        background: var(--color-charcoal-700);
        color: var(--color-gray-200);
        padding: 80px var(--space-24);
    }

    .photos-section .section-title {
        color: var(--color-gray-200);
    }

    .photos-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: var(--space-16);
        max-width: 1400px;
        margin: 0 auto;
    }

    .photo-card {
        position: relative;
        aspect-ratio: 4/3;
        border-radius: var(--radius-lg);
        overflow: hidden;
        cursor: pointer;
        transition: transform var(--duration-normal);
        border: 2px solid transparent;
    }

    .photo-card:nth-child(3n+1) {
        grid-row: span 2;
        aspect-ratio: 3/4;
    }

    .photo-card:hover {
        transform: scale(1.02);
        border-color: var(--color-primary);
        box-shadow: 0 0 10px 2px rgba(var(--color-teal-500-rgb), 0.5);
    }

    .photo-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }

    .photo-card:hover img {
        transform: scale(1.1);
    }

    .photo-overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: var(--space-16);
        background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        opacity: 0;
        transition: opacity var(--duration-normal);
    }

    .photo-card:hover .photo-overlay {
        opacity: 1;
    }

    .photo-title {
        font-size: var(--font-size-sm);
        font-weight: var(--font-weight-medium);
    }

    .photo-date {
        font-size: var(--font-size-xs);
        opacity: 0.8;
    }

    /* ==================== POSTS SECTION ==================== */
    .posts-scroll-container {
        overflow-x: auto;
        padding: 0 var(--space-24) var(--space-24);
        margin: 0 calc(-1 * var(--space-24));
        scrollbar-width: thin;
        scrollbar-color: var(--color-primary) var(--color-surface);
    }

    .posts-row {
        display: flex;
        gap: var(--space-24);
        padding: var(--space-8) 0;
    }

    .post-card-link {
        flex: 0 0 320px;
        background: var(--color-surface);
        border-radius: var(--radius-lg);
        overflow: hidden;
        border: 1px solid var(--color-card-border);
        transition: border-color var(--duration-normal), box-shadow var(--duration-normal), transform var(--duration-normal);
        text-decoration: none;
        color: inherit;
    }

    .post-card-link:hover {
        transform: translateY(-4px);
        border-color: var(--color-primary);
        box-shadow: 0 0 15px 3px rgba(var(--color-teal-500-rgb), 0.4);
        text-decoration: none;
        color: inherit;
    }

    .post-card-image {
        width: 100%;
        height: 180px;
        object-fit: cover;
    }

    .post-card-content {
        padding: var(--space-20);
    }

    .post-card-date {
        font-size: var(--font-size-xs);
        color: var(--color-text-secondary);
        margin-bottom: var(--space-8);
    }

    .post-card-title {
        font-size: var(--font-size-lg);
        font-weight: var(--font-weight-semibold);
        margin-bottom: var(--space-8);
        line-height: var(--line-height-tight);
        color: var(--color-text);
    }

    .post-card-stats {
        display: flex;
        gap: var(--space-16);
        font-size: var(--font-size-sm);
        color: var(--color-text-secondary);
    }

    .post-card-stats i {
        margin-right: var(--space-4);
        color: var(--color-primary);
    }

    /* ==================== FOOTER ==================== */
    .area-footer {
        background: var(--color-surface);
        padding: 48px var(--space-24);
        text-align: center;
        border-top: 1px solid var(--color-card-border);
    }

    .related-areas {
        margin-top: var(--space-24);
    }

    .related-areas-title {
        font-size: var(--font-size-sm);
        color: var(--color-text-secondary);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: var(--space-16);
    }

    .related-areas-list {
        display: flex;
        justify-content: center;
        gap: var(--space-12);
        flex-wrap: wrap;
    }

    .related-area-link {
        padding: var(--space-8) var(--space-16);
        background: var(--color-background);
        border-radius: var(--radius-full);
        text-decoration: none;
        color: var(--color-text);
        font-size: var(--font-size-sm);
        transition: background var(--duration-fast), color var(--duration-fast);
        border: 1px solid var(--color-card-border);
    }

    .related-area-link:hover {
        background: var(--color-primary);
        color: var(--color-btn-primary-text);
        text-decoration: none;
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 768px) {
        .hero-stats-preview {
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--space-16);
        }

        .hero-stat-value {
            font-size: var(--font-size-2xl);
        }

        .photos-grid {
            grid-template-columns: repeat(2, 1fr);
        }

        .photo-card:nth-child(3n+1) {
            grid-row: span 1;
            aspect-ratio: 4/3;
        }

        .section {
            padding: 48px var(--space-16);
        }
    }

    /* Fixed navbar over hero */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        background: rgba(var(--color-slate-900-rgb), 0.9) !important;
        backdrop-filter: blur(10px);
    }

    .navbar-light .navbar-nav .nav-link,
    .navbar-light .navbar-brand {
        color: var(--color-gray-200) !important;
    }

    .navbar-light .navbar-toggler-icon {
        filter: invert(1);
    }
</style>

<script id="area-config" type="application/json">
{
    "slug": "{{ slug }}",
    "name": "{{ name }}",
    "areaType": "{{ area_type }}",
    "areaTypeLabel": "{{ area_type_label }}",
    "areaField": "{{ area_field }}",
    "parentName": "{{ parent_name }}",
    "parentUrl": "{{ parent_url }}",
    "voivodeshipName": "{{ voivodeship_name }}",
    "voivodeshipUrl": "{{ voivodeship_url }}",
    "bbox": {
        "south": {{ bbox_south }},
        "north": {{ bbox_north }},
        "west": {{ bbox_west }},
        "east": {{ bbox_east }}
    }
}
</script>
<script id="area-data" type="application/json">{{ area_data_json }}</script>
<div id="root"></div>
<script src="/js/self/area_show.js"></script>
