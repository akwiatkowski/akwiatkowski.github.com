<script>
  fetch('/nav_stats.json')
  .then(response => response.json())
  .then(data => {
    data.post_counts.forEach(item => {
      const element = document.getElementById(item.html_id);
      if (element) {
        element.innerHTML = "(" + item.count + ")";
      }
    });
  })
  .catch(error => {
    console.error('Error fetching nav stats:', error);
  });
</script>
