    <style>
        /* ==============================================
           CSS CONFIGURATION
           These must match the JS CONFIG values below
           ============================================== */
        :root {
            /* Grid layout - must match CONFIG in JS */
            --columns-desktop: 8;
            --rows-desktop: 5;
            --columns-tablet: 5;
            --rows-tablet: 4;
            --columns-mobile: 3;
            --rows-mobile: 3;

            /* Photo aspect ratio (4:3) */
            --photo-aspect-ratio: 4 / 3;

            /* Gap between photos - exactly 1px, do not change */
            --grid-gap: 1px;

            /* Days per column */
            --days-per-column: 5;

            /* Animation speed */
            --transition-speed: 0.3s;

            /* Current values (set by JS based on screen size) */
            --current-columns: var(--columns-desktop);
            --current-rows: var(--rows-desktop);
        }

        /* Dark theme (default) */
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --bg-gap: #000000; /* Gap color between photos */
            --text-primary: #f0f0f0;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border-color: #333333;
            --overlay-bg: rgba(0, 0, 0, 0.95);
            --shadow: rgba(0, 0, 0, 0.5);
        }

        /* Light theme */
        .light-theme {
            --bg-primary: #f5f5f5;
            --bg-secondary: #e8e8e8;
            --bg-tertiary: #d8d8d8;
            --bg-gap: #888888; /* Gap color between photos */
            --text-primary: #1a1a1a;
            --text-secondary: #555555;
            --text-muted: #888888;
            --border-color: #cccccc;
            --overlay-bg: rgba(255, 255, 255, 0.95);
            --shadow: rgba(0, 0, 0, 0.2);
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background var(--transition-speed), color var(--transition-speed);
        }

        /* ===== LAYOUT ===== */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ===== HEADER ===== */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: linear-gradient(to bottom, var(--bg-primary) 0%, transparent 100%);
            pointer-events: none;
        }

        .header > * {
            pointer-events: auto;
        }

        .theme-toggle {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all var(--transition-speed);
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
        }

        /* ===== PHOTO GRID ===== */
        .grid-container {
            flex: 1;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--border-color) transparent;
        }

        .grid-container::-webkit-scrollbar {
            height: 6px;
        }

        .grid-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .grid-container::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .photo-grid {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 0; /* No gap - using margin instead for consistent 1px spacing */
            padding: 0;
            height: calc(100vh - 100px);
            height: calc(100dvh - 100px);
            background: var(--bg-gap); /* Gap color shows through between photos */
        }

        .photo-cell {
            /* Calculate exact pixel dimensions - account for 1px margin between cells */
            --cell-height: calc((100vh - 100px - var(--rows-desktop) * 1px) / var(--rows-desktop));
            --cell-width: calc(var(--cell-height) * 4 / 3);
            width: var(--cell-width);
            height: var(--cell-height);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            border-radius: 0;
            cursor: pointer;
            background: var(--bg-secondary);
            /* 1px margin creates consistent gap - black background shows through */
            margin: 0 1px 1px 0;
        }

        .photo-cell:hover {
            /* No size increase - just subtle brightness change */
            filter: brightness(1.1);
        }

        .photo-cell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.3s ease;
        }

        .photo-cell img.loading {
            opacity: 0;
        }

        .photo-cell .photo-date-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 4px 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            font-size: 0.7rem;
            color: #fff;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .photo-cell:hover .photo-date-overlay {
            opacity: 1;
        }

        /* ===== SLIDER SECTION ===== */
        .slider-section {
            padding: 15px 20px 20px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .slider-container {
            max-width: 100%;
        }

        .day-slider {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--bg-tertiary);
            border-radius: 4px;
            outline: none;
            cursor: pointer;
        }

        .day-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            background: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 6px var(--shadow);
            transition: transform 0.15s;
        }

        .day-slider::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .day-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: var(--text-primary);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 6px var(--shadow);
        }

        .slider-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .current-date {
            font-size: 1.5rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .month-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 5px;
            padding: 0 12px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.97);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            overflow: hidden;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal-overlay.visible {
            opacity: 1;
        }

        .modal-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-image-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: pinch-zoom pan-y;
        }

        .modal-image {
            max-width: 95vw;
            max-height: 95vh;
            object-fit: contain;
            display: block;
            border-radius: 4px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
        }

        /* Caption overlay at bottom */
        .modal-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 60px 30px 30px;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
            color: #fff;
            pointer-events: none;
        }

        .modal-caption > * {
            pointer-events: auto;
        }

        .modal-caption-inner {
            max-width: 600px;
        }

        .modal-date {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 6px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .modal-desc {
            font-size: 1.4rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .modal-link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            padding: 6px 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            font-size: 0.85rem;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }

        .modal-link:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            color: #fff;
        }

        .modal-exif {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 12px;
            line-height: 1.5;
        }

        /* Map container - bottom right corner */
        .modal-map-container {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 180px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            display: none;
            z-index: 10;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .modal-map-container:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .modal-map-container.visible {
            display: block;
        }

        #modalMap {
            width: 100%;
            height: 100%;
        }

        /* Override Leaflet styles */
        .leaflet-container {
            background: #1a1a1a;
        }

        .leaflet-control-attribution {
            display: none;
        }

        /* Custom marker style */
        .custom-marker {
            width: 16px;
            height: 16px;
            background: #fff;
            border: 3px solid rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        /* Close button */
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.5rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 1001;
            backdrop-filter: blur(4px);
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }

        /* Navigation buttons */
        .modal-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            width: 54px;
            height: 54px;
            font-size: 1.6rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 1001;
            backdrop-filter: blur(4px);
        }

        .modal-nav:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .modal-nav.prev {
            left: 20px;
        }

        .modal-nav.next {
            right: 20px;
        }

        /* ===== LOADING STATE ===== */
        .loading-spinner {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: var(--text-secondary);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .photo-grid {
                height: calc(100vh - 120px);
                height: calc(100dvh - 120px);
            }

            .photo-cell {
                --cell-height: calc((100vh - 120px - var(--rows-tablet) * 1px) / var(--rows-tablet));
                --cell-width: calc(var(--cell-height) * 4 / 3);
            }

            .header {
                padding: 10px 15px;
            }

            .modal-nav {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }

            .modal-nav.prev {
                left: 10px;
            }

            .modal-nav.next {
                right: 10px;
            }
        }

        @media (max-width: 600px) {
            .photo-grid {
                height: calc(100vh - 130px);
                height: calc(100dvh - 130px);
            }

            .photo-cell {
                --cell-height: calc((100vh - 130px - var(--rows-mobile) * 1px) / var(--rows-mobile));
                --cell-width: calc(var(--cell-height) * 4 / 3);
            }

            .current-date {
                font-size: 1.2rem;
            }

            .month-labels span {
                font-size: 0.65rem;
            }

            .modal-caption {
                padding: 15px;
            }

            .modal-desc {
                font-size: 1rem;
            }

            .modal-close {
                top: 10px;
                right: 10px;
                width: 38px;
                height: 38px;
            }

            .modal-nav {
                display: none;
            }

            .modal-caption {
                padding: 40px 20px 20px;
            }

            .modal-desc {
                font-size: 1.1rem;
            }

            .modal-map-container {
                width: 140px;
                height: 95px;
                bottom: 20px;
                right: 20px;
            }
        }
    </style>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <button class="theme-toggle" onclick="toggleTheme()" title="Zmien motyw">
                <span class="theme-icon">☀️</span>
            </button>
        </header>

        <!-- Photo Grid -->
        <div class="grid-container" id="gridContainer">
            <div class="photo-grid" id="photoGrid">
                <!-- Photos will be inserted here -->
            </div>
        </div>

        <!-- Slider Section -->
        <div class="slider-section">
            <div class="slider-container">
                <input type="range" class="day-slider" id="daySlider" min="1" max="366" value="1">
                <div class="month-labels">
                    <span>Sty</span>
                    <span>Lut</span>
                    <span>Mar</span>
                    <span>Kwi</span>
                    <span>Maj</span>
                    <span>Cze</span>
                    <span>Lip</span>
                    <span>Sie</span>
                    <span>Wrz</span>
                    <span>Paz</span>
                    <span>Lis</span>
                    <span>Gru</span>
                </div>
                <div class="slider-info">
                    <span class="current-date" id="currentDate">01-01</span>
                    <span class="photo-stats" id="photoStats" style="color: var(--text-muted); font-size: 0.75rem; font-variant-numeric: tabular-nums;"></span>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <button class="modal-nav prev" onclick="navigateModal(-1)">&#8249;</button>
            <button class="modal-nav next" onclick="navigateModal(1)">&#8250;</button>
            <div class="modal-content">
                <div class="modal-image-container">
                    <img class="modal-image" id="modalImage" src="" alt="">
                </div>
                <!-- Caption overlay at bottom left -->
                <div class="modal-caption">
                    <div class="modal-caption-inner">
                        <div class="modal-date" id="modalDate"></div>
                        <div class="modal-desc" id="modalDesc"></div>
                        <a class="modal-link" id="modalLink" href="#" target="_blank">Zobacz wpis</a>
                        <div class="modal-exif" id="modalExif"></div>
                    </div>
                </div>
                <!-- Map in bottom right corner -->
                <div class="modal-map-container" id="modalMapContainer" title="Kliknij aby otworzyc w OpenStreetMap">
                    <div id="modalMap"></div>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading-spinner" id="loadingSpinner">Ladowanie zdjec...</div>
    </div>

    <script>
        // =======================================================
        // CONFIGURATION - Edit these values to customize the grid
        // =======================================================
        const CONFIG = {
            // Grid layout (visible rows/columns on screen)
            // Desktop: screens > 1024px
            // Tablet: screens 601-1024px
            // Mobile: screens <= 600px
            COLUMNS_DESKTOP: 8,
            ROWS_DESKTOP: 5,
            COLUMNS_TABLET: 5,
            ROWS_TABLET: 4,
            COLUMNS_MOBILE: 3,
            ROWS_MOBILE: 3,

            // How many days each column represents
            DAYS_PER_COLUMN: 5,

            // Shuffle photos on each page load (keeps relative order but adds variety)
            ENABLE_SHUFFLE: true,

            // Random seed: null = different each time, or set a number for reproducible order
            RANDOM_SEED: null,

            // Data source URL
            PHOTOS_URL: '/photos.json',

            // Tag weights for prioritizing which photos appear first
            TAG_WEIGHTS: {
                'portfolio': 15,
                'best': 12,
                'good': 4,
                'timeline': 3,
                'mountains': 3,
                'winter': 4,
                'spring': 3,
                'summer': 3,
                'autumn': 3,
                'night': 5,
                'sunrise': 7,
                'sunset': 6,
                'city': 2,
                'nature': 3,
                'landscape': 4,
                'animal': 3,
                'countryside': 2
            }
        };

        // ===== STATE =====
        let allPhotos = [];
        let timelinePhotos = [];  // Photos with timeline tag + published
        let fallbackPhotos = [];  // All other photos (for filling gaps)
        let gridPhotos = [];
        let usedPhotoIds = new Set();  // Track used photos to prevent duplicates
        let currentModalIndex = -1;
        let isScrolling = false;
        let scrollTimeout = null;
        let touchStartY = 0;

        // Statistics for density analysis
        let gridStats = {
            totalSlots: 0,
            filledSlots: 0,
            timelinePhotosUsed: 0,
            fallbackPhotosUsed: 0,
            emptySlots: 0,
            totalColumns: 0,
            rows: 0
        };

        // Per-column statistics for scroll-based analysis
        let columnStats = [];  // Array of { timelineAvailable, timelineUsed, fallbackUsed, slots }

        // Leaflet map instance for modal
        let modalMap = null;
        let modalMarker = null;
        let currentPhotoCoords = null; // Store coords for OSM link

        // ===== UTILITY FUNCTIONS =====

        // Seeded random number generator
        function seededRandom(seed) {
            const x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        let randomSeed = CONFIG.RANDOM_SEED || Date.now();
        function random() {
            if (CONFIG.ENABLE_SHUFFLE) {
                randomSeed++;
                return seededRandom(randomSeed);
            }
            return Math.random();
        }

        // Get day of year from date (ignoring year)
        function getDayOfYear(dateStr) {
            const date = new Date(dateStr);
            const month = date.getMonth();
            const day = date.getDate();

            // Days in each month (non-leap year base)
            const daysInMonth = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            let dayOfYear = day;
            for (let i = 0; i < month; i++) {
                dayOfYear += daysInMonth[i];
            }
            return dayOfYear;
        }

        // Get MM-DD from day of year
        function dayOfYearToDate(dayOfYear) {
            const daysInMonth = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            let remaining = dayOfYear;
            let month = 0;

            while (remaining > daysInMonth[month]) {
                remaining -= daysInMonth[month];
                month++;
            }

            const mm = String(month + 1).padStart(2, '0');
            const dd = String(remaining).padStart(2, '0');
            return `${mm}-${dd}`;
        }

        // Calculate photo weight based on tags
        function calculatePhotoWeight(photo) {
            let weight = 0;
            if (photo.tags && Array.isArray(photo.tags)) {
                photo.tags.forEach(tag => {
                    weight += CONFIG.TAG_WEIGHTS[tag.toLowerCase()] || 1;
                });
            }
            return weight;
        }

        // Format exposure time
        function formatExposure(exposure) {
            if (!exposure) return null;
            if (exposure >= 1) return `${exposure}s`;
            const denominator = Math.round(1 / exposure);
            return `1/${denominator}s`;
        }

        // ===== THEME =====
        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const icon = document.querySelector('.theme-icon');
            icon.textContent = document.body.classList.contains('light-theme') ? '🌙' : '☀️';
            localStorage.setItem('theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                document.querySelector('.theme-icon').textContent = '🌙';
            }
        }

        // ===== DATA LOADING =====
        async function loadPhotos() {
            try {
                const response = await fetch(CONFIG.PHOTOS_URL);
                const data = await response.json();
                allPhotos = data.photos || [];
                processPhotos();
            } catch (error) {
                console.error('Error loading photos:', error);
                // For demo, use sample data if fetch fails
                useSampleData();
            }
        }

        function useSampleData() {
            // Sample data for testing
            allPhotos = [
                {
                    desc: "Poreba Gorna",
                    full_url: "https://picsum.photos/1200/900?random=1",
                    gallery_thumb_url: "https://picsum.photos/400/300?random=1",
                    time: "2011-05-03T21:00:00+02:00",
                    post_slug: "2011-05-03-gorce",
                    post_url: "2011/05/03/gorce.html",
                    is_published: true,
                    tags: ["timeline", "good", "spring"],
                    "exif.camera_name": "Pentax K100D",
                    "exif.lens_name": "Pentax FA 50mm Macro",
                    "exif.aperture": 9.0,
                    "exif.iso": 200
                }
            ];

            // Generate more sample photos for testing
            const months = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];
            const tags = ['timeline', 'good', 'best', 'mountains', 'nature', 'city', 'winter', 'spring', 'summer', 'autumn'];

            for (let i = 2; i <= 300; i++) {
                const month = months[Math.floor(Math.random() * 12)];
                const day = String(Math.floor(Math.random() * 28) + 1).padStart(2, '0');
                const photoTags = ['timeline'];

                // Add random additional tags
                for (let j = 0; j < Math.floor(Math.random() * 3); j++) {
                    const tag = tags[Math.floor(Math.random() * tags.length)];
                    if (!photoTags.includes(tag)) photoTags.push(tag);
                }

                allPhotos.push({
                    desc: `Zdjecie ${i}`,
                    full_url: `https://picsum.photos/1200/900?random=${i}`,
                    gallery_thumb_url: `https://picsum.photos/400/300?random=${i}`,
                    time: `2020-${month}-${day}T12:00:00+02:00`,
                    post_slug: `post-${i}`,
                    post_url: `2020/${month}/${day}/post-${i}.html`,
                    is_published: true,
                    tags: photoTags,
                    "exif.camera_name": "Sample Camera",
                    "exif.lens_name": "Sample Lens",
                    "exif.aperture": 5.6,
                    "exif.iso": 400
                });
            }

            processPhotos();
        }

        function processPhotos() {
            // Generate unique IDs for each photo
            allPhotos.forEach((photo, index) => {
                photo._id = photo.full_url || `photo_${index}`;
            });

            // Separate timeline photos from fallback photos
            timelinePhotos = [];
            fallbackPhotos = [];

            allPhotos.forEach(photo => {
                const hasTimelineTag = photo.tags &&
                    Array.isArray(photo.tags) &&
                    photo.tags.some(tag => tag.toLowerCase() === 'timeline');
                const isPublished = photo.is_published === true;

                // Add computed properties
                photo.dayOfYear = getDayOfYear(photo.time);
                photo.weight = calculatePhotoWeight(photo);

                if (hasTimelineTag && isPublished) {
                    timelinePhotos.push(photo);
                } else {
                    fallbackPhotos.push(photo);
                }
            });

            // Sort both by day of year, then by weight
            timelinePhotos.sort((a, b) => a.dayOfYear - b.dayOfYear || b.weight - a.weight);
            fallbackPhotos.sort((a, b) => a.dayOfYear - b.dayOfYear || b.weight - a.weight);

            // Organize into columns and build grid
            buildGrid();

            // Hide loading spinner
            document.getElementById('loadingSpinner').style.display = 'none';
        }

        function buildGrid() {
            const gridContainer = document.getElementById('photoGrid');
            gridContainer.innerHTML = '';

            // Reset used photos tracking
            usedPhotoIds = new Set();

            // Determine current layout based on screen size
            let rows;
            if (window.innerWidth <= 600) {
                rows = CONFIG.ROWS_MOBILE;
            } else if (window.innerWidth <= 1024) {
                rows = CONFIG.ROWS_TABLET;
            } else {
                rows = CONFIG.ROWS_DESKTOP;
            }

            // Calculate number of columns needed (366 days / days per column)
            const totalColumns = Math.ceil(366 / CONFIG.DAYS_PER_COLUMN);
            // fix for firefox
            const containerRect = document.getElementById('gridContainer').getBoundingClientRect();
            const availableWidth = containerRect.width || window.innerWidth;
            document.getElementById('photoGrid').style.width = `${availableWidth}px`;

            // Organize timeline photos by column (time period)
            const timelineByColumn = {};
            const fallbackByColumn = {};
            for (let col = 0; col < totalColumns; col++) {
                timelineByColumn[col] = [];
                fallbackByColumn[col] = [];
            }

            timelinePhotos.forEach(photo => {
                const column = Math.floor((photo.dayOfYear - 1) / CONFIG.DAYS_PER_COLUMN);
                if (column >= 0 && column < totalColumns) {
                    timelineByColumn[column].push(photo);
                }
            });

            fallbackPhotos.forEach(photo => {
                const column = Math.floor((photo.dayOfYear - 1) / CONFIG.DAYS_PER_COLUMN);
                if (column >= 0 && column < totalColumns) {
                    fallbackByColumn[column].push(photo);
                }
            });

            // Sort and shuffle photos within each column by weight
            Object.keys(timelineByColumn).forEach(col => {
                timelineByColumn[col].sort((a, b) => b.weight - a.weight);
                if (CONFIG.ENABLE_SHUFFLE) {
                    timelineByColumn[col] = shuffleWithWeight(timelineByColumn[col]);
                }
            });

            Object.keys(fallbackByColumn).forEach(col => {
                fallbackByColumn[col].sort((a, b) => b.weight - a.weight);
                if (CONFIG.ENABLE_SHUFFLE) {
                    fallbackByColumn[col] = shuffleWithWeight(fallbackByColumn[col]);
                }
            });

            // Build grid (column by column, filling rows) - NO DUPLICATES
            gridPhotos = [];

            // Reset statistics
            gridStats = {
                totalSlots: totalColumns * rows,
                filledSlots: 0,
                timelinePhotosUsed: 0,
                fallbackPhotosUsed: 0,
                emptySlots: 0,
                totalColumns: totalColumns,
                rows: rows
            };

            // Reset per-column statistics
            columnStats = [];

            // Track which photos are timeline vs fallback
            const timelineIds = new Set(timelinePhotos.map(p => p._id));

            for (let col = 0; col < totalColumns; col++) {
                // Initialize column stats
                const colStat = {
                    timelineAvailable: timelineByColumn[col].length,
                    timelineUsed: 0,
                    fallbackUsed: 0,
                    empty: 0,
                    slots: rows
                };

                for (let row = 0; row < rows; row++) {
                    let photo = null;

                    // 1. Try to get unused photo from this column's timeline photos
                    photo = getUnusedPhoto(timelineByColumn[col]);

                    // 2. If not found, try nearby columns' timeline photos
                    if (!photo) {
                        photo = borrowUnusedPhoto(timelineByColumn, col, totalColumns);
                    }

                    // 3. If still not found, try this column's fallback photos
                    if (!photo) {
                        photo = getUnusedPhoto(fallbackByColumn[col]);
                    }

                    // 4. If still not found, try nearby columns' fallback photos
                    if (!photo) {
                        photo = borrowUnusedPhoto(fallbackByColumn, col, totalColumns);
                    }

                    if (photo) {
                        usedPhotoIds.add(photo._id);
                        const cell = createPhotoCell(photo, gridPhotos.length);
                        gridContainer.appendChild(cell);
                        gridPhotos.push(photo);

                        // Track global stats
                        gridStats.filledSlots++;
                        if (timelineIds.has(photo._id)) {
                            gridStats.timelinePhotosUsed++;
                            colStat.timelineUsed++;
                        } else {
                            gridStats.fallbackPhotosUsed++;
                            colStat.fallbackUsed++;
                        }
                    } else {
                        // No more photos available - create empty placeholder
                        const cell = document.createElement('div');
                        cell.className = 'photo-cell';
                        cell.style.background = 'var(--bg-tertiary)';
                        gridContainer.appendChild(cell);
                        gridPhotos.push(null);
                        gridStats.emptySlots++;
                        colStat.empty++;
                    }
                }

                columnStats.push(colStat);
            }

            // Log density analysis to console
            logDensityAnalysis();

            setupScrollSync();
        }

        // Log density analysis to console
        function logDensityAnalysis() {
            const availableTimeline = timelinePhotos.length;
            const availableFallback = fallbackPhotos.length;
            const totalAvailable = availableTimeline + availableFallback;
            const needed = gridStats.totalSlots;
            const used = gridStats.filledSlots;
            const timelineUsed = gridStats.timelinePhotosUsed;
            const fallbackUsed = gridStats.fallbackPhotosUsed;
            const unusedTimeline = availableTimeline - timelineUsed;
            const density = (used / needed * 100).toFixed(1);
            const timelineUtilization = (timelineUsed / availableTimeline * 100).toFixed(1);

            console.log('%c===== PHOTO TIMELINE DENSITY ANALYSIS =====', 'font-weight: bold; color: #00ff00');
            console.log(`Grid: ${gridStats.totalColumns} columns × ${gridStats.rows} rows = ${needed} slots`);
            console.log(`Days per column: ${CONFIG.DAYS_PER_COLUMN}`);
            console.log('');
            console.log('%cPhoto Inventory:', 'font-weight: bold');
            console.log(`  Timeline photos (tag + published): ${availableTimeline}`);
            console.log(`  Fallback photos (other):           ${availableFallback}`);
            console.log(`  Total available:                   ${totalAvailable}`);
            console.log('');
            console.log('%cUsage:', 'font-weight: bold');
            console.log(`  Timeline photos used: ${timelineUsed} / ${availableTimeline} (${timelineUtilization}%)`);
            console.log(`  Fallback photos used: ${fallbackUsed}`);
            console.log(`  Empty slots:          ${gridStats.emptySlots}`);
            console.log(`  Grid fill rate:       ${density}%`);
            console.log('');

            // Density recommendations
            console.log('%cDensity Analysis:', 'font-weight: bold');
            if (unusedTimeline > 0) {
                const possibleRows = Math.ceil(availableTimeline / gridStats.totalColumns);
                console.log(`  ✓ ${unusedTimeline} timeline photos NOT shown`);
                console.log(`  ✓ Could increase rows to ~${possibleRows} to show all timeline photos`);
                console.log(`  ✓ Current: ${gridStats.rows} rows | Recommended max: ${possibleRows} rows`);
            } else if (fallbackUsed > 0) {
                console.log(`  ⚠ Using ${fallbackUsed} fallback photos to fill grid`);
                console.log(`  ⚠ Need ${fallbackUsed} more timeline photos OR reduce rows`);
                const idealRows = Math.floor(availableTimeline / gridStats.totalColumns);
                console.log(`  ⚠ Current: ${gridStats.rows} rows | Ideal for timeline-only: ${idealRows} rows`);
            }

            if (gridStats.emptySlots > 0) {
                console.log(`  ✗ ${gridStats.emptySlots} empty slots - need more photos!`);
            }

            // Summary recommendation
            console.log('');
            const ratio = availableTimeline / needed;
            if (ratio >= 1.5) {
                console.log(`%c→ DENSITY OK: ${ratio.toFixed(2)}x more timeline photos than slots`, 'color: #00ff00');
            } else if (ratio >= 1.0) {
                console.log(`%c→ DENSITY TIGHT: ${ratio.toFixed(2)}x timeline photos vs slots`, 'color: #ffff00');
            } else {
                console.log(`%c→ DENSITY LOW: Only ${ratio.toFixed(2)}x timeline photos vs slots`, 'color: #ff6600');
            }
            console.log('');
        }

        // Get first unused photo from array
        function getUnusedPhoto(photos) {
            if (!photos) return null;
            for (const photo of photos) {
                if (!usedPhotoIds.has(photo._id)) {
                    return photo;
                }
            }
            return null;
        }

        // Borrow unused photo from nearby columns
        function borrowUnusedPhoto(photosByColumn, targetCol, totalColumns) {
            for (let offset = 1; offset <= totalColumns; offset++) {
                // Try left column first, then right
                const leftCol = targetCol - offset;
                const rightCol = targetCol + offset;

                if (leftCol >= 0) {
                    const photo = getUnusedPhoto(photosByColumn[leftCol]);
                    if (photo) return photo;
                }
                if (rightCol < totalColumns) {
                    const photo = getUnusedPhoto(photosByColumn[rightCol]);
                    if (photo) return photo;
                }
            }
            return null;
        }

        function shuffleWithWeight(photos) {
            // Weighted shuffle - higher weight photos stay near top but with some randomness
            return photos.map((photo, index) => ({
                photo,
                sortKey: index + random() * 2
            }))
            .sort((a, b) => a.sortKey - b.sortKey)
            .map(item => item.photo);
        }

        function createPhotoCell(photo, index) {
            const cell = document.createElement('div');
            cell.className = 'photo-cell';
            cell.onclick = () => openModal(index);

            const img = document.createElement('img');
            img.className = 'loading';
            img.alt = photo.desc || '';
            img.loading = 'lazy';

            img.onload = () => img.classList.remove('loading');
            img.src = photo.gallery_thumb_url || photo.full_url;

            const overlay = document.createElement('div');
            overlay.className = 'photo-date-overlay';
            overlay.textContent = dayOfYearToDate(photo.dayOfYear);

            cell.appendChild(img);
            cell.appendChild(overlay);

            return cell;
        }

        // ===== SCROLL & SLIDER SYNC =====
        function setupScrollSync() {
            const gridContainer = document.getElementById('gridContainer');
            const slider = document.getElementById('daySlider');

            // Scroll to slider sync
            gridContainer.addEventListener('scroll', () => {
                if (isScrolling) return;

                clearTimeout(scrollTimeout);
                scrollTimeout = setTimeout(() => {
                    const scrollPercent = gridContainer.scrollLeft / (gridContainer.scrollWidth - gridContainer.clientWidth);
                    const day = Math.round(scrollPercent * 365) + 1;

                    slider.value = day;
                    updateDateDisplay(day);
                    updateVisibleColumnsStats();
                }, 100);
            });

            // Slider to scroll sync
            slider.addEventListener('input', (e) => {
                const day = parseInt(e.target.value);
                updateDateDisplay(day);
                scrollToDay(day);
            });

            // Initialize display
            updateDateDisplay(1);
            updateVisibleColumnsStats();
        }

        function updateDateDisplay(day) {
            document.getElementById('currentDate').textContent = dayOfYearToDate(day);
        }

        function updateVisibleColumnsStats() {
            const statsEl = document.getElementById('photoStats');
            const gridContainer = document.getElementById('gridContainer');

            if (columnStats.length === 0) {
                statsEl.textContent = '';
                return;
            }

            // Calculate which column is in the center of the viewport
            const scrollLeft = gridContainer.scrollLeft;
            const viewportWidth = gridContainer.clientWidth;
            const centerX = scrollLeft + viewportWidth / 2;

            // Get cell width from first photo cell
            const firstCell = document.querySelector('.photo-cell');
            if (!firstCell) return;

            const cellWidth = firstCell.offsetWidth + 1; // +1 for margin
            const centerColumn = Math.floor(centerX / cellWidth);

            // Get stats for 3 center columns (center-1, center, center+1)
            const colIndices = [
                Math.max(0, centerColumn - 1),
                Math.min(columnStats.length - 1, centerColumn),
                Math.min(columnStats.length - 1, centerColumn + 1)
            ];

            // Aggregate stats for these 3 columns
            let totalAvailable = 0;
            let totalSlots = 0;
            let timelineUsed = 0;
            let fallbackUsed = 0;

            const uniqueCols = [...new Set(colIndices)];
            uniqueCols.forEach(colIdx => {
                if (columnStats[colIdx]) {
                    totalAvailable += columnStats[colIdx].timelineAvailable;
                    totalSlots += columnStats[colIdx].slots;
                    timelineUsed += columnStats[colIdx].timelineUsed;
                    fallbackUsed += columnStats[colIdx].fallbackUsed;
                }
            });

            // Calculate date range for these columns
            const startDay = uniqueCols[0] * CONFIG.DAYS_PER_COLUMN + 1;
            const endDay = Math.min(366, (uniqueCols[uniqueCols.length - 1] + 1) * CONFIG.DAYS_PER_COLUMN);
            const dateRange = `${dayOfYearToDate(startDay)}-${dayOfYearToDate(endDay)}`;

            // Build stats text
            let statsText = `${dateRange}: ${totalAvailable} dostepnych / ${totalSlots} miejsc`;
            if (fallbackUsed > 0) {
                statsText += ` (${fallbackUsed} innych)`;
            }

            // Add indicator
            if (totalAvailable >= totalSlots) {
                statsText += ' ✓';
            } else {
                statsText += ` ⚠ brak ${totalSlots - totalAvailable}`;
            }

            statsEl.textContent = statsText;
        }

        function scrollToDay(day) {
            const gridContainer = document.getElementById('gridContainer');
            const scrollPercent = (day - 1) / 365;
            const targetScroll = scrollPercent * (gridContainer.scrollWidth - gridContainer.clientWidth);

            isScrolling = true;
            gridContainer.scrollTo({
                left: targetScroll,
                behavior: 'smooth'
            });

            setTimeout(() => {
                isScrolling = false;
                updateVisibleColumnsStats();
            }, 500);
        }

        // ===== MODAL =====
        function openModal(index) {
            const photo = gridPhotos[index];
            if (!photo) return;

            currentModalIndex = index;
            const modal = document.getElementById('modalOverlay');
            const modalImage = document.getElementById('modalImage');
            const modalDate = document.getElementById('modalDate');
            const modalDesc = document.getElementById('modalDesc');
            const modalLink = document.getElementById('modalLink');
            const modalExif = document.getElementById('modalExif');
            const modalMapContainer = document.getElementById('modalMapContainer');

            // Set image
            modalImage.src = photo.full_url;

            // Set date (full date from time field)
            const date = new Date(photo.time);
            modalDate.textContent = date.toLocaleDateString('pl-PL', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
            });

            // Set description
            modalDesc.textContent = photo.desc || '';

            // Set link
            if (photo.post_url) {
                modalLink.href = photo.post_url;
                modalLink.style.display = 'inline-block';
            } else {
                modalLink.style.display = 'none';
            }

            // Handle map
            const hasCoords = photo['exif.lat'] != null && photo['exif.lon'] != null;
            if (hasCoords) {
                modalMapContainer.classList.add('visible');
                // Initialize or update map after modal is visible
                setTimeout(() => {
                    initModalMap(photo['exif.lat'], photo['exif.lon']);
                }, 50);
            } else {
                modalMapContainer.classList.remove('visible');
            }

            // Set EXIF info
            const exifParts = [];
            if (photo['exif.camera_name']) exifParts.push(photo['exif.camera_name']);
            if (photo['exif.lens_name']) exifParts.push(photo['exif.lens_name']);
            if (photo['exif.aperture']) exifParts.push(`f/${photo['exif.aperture']}`);
            if (photo['exif.exposure']) exifParts.push(formatExposure(photo['exif.exposure']));
            if (photo['exif.iso']) exifParts.push(`ISO ${photo['exif.iso']}`);
            if (photo['exif.focal_35mm']) exifParts.push(`${photo['exif.focal_35mm']}mm`);

            modalExif.textContent = exifParts.join(' • ');

            // Show modal
            modal.classList.add('active');
            requestAnimationFrame(() => {
                modal.classList.add('visible');
            });

            // Prevent body scroll
            document.body.style.overflow = 'hidden';
        }

        function initModalMap(lat, lon) {
            // Store coords for OSM link
            currentPhotoCoords = { lat, lon };

            // Custom circle marker icon
            const circleIcon = L.divIcon({
                className: 'custom-marker',
                iconSize: [16, 16],
                iconAnchor: [8, 8]
            });

            if (modalMap) {
                // Map already exists, just update view and marker
                modalMap.setView([lat, lon], 14);
                if (modalMarker) {
                    modalMarker.setLatLng([lat, lon]);
                } else {
                    modalMarker = L.marker([lat, lon], { icon: circleIcon }).addTo(modalMap);
                }
                modalMap.invalidateSize();
            } else {
                // Create new map
                modalMap = L.map('modalMap', {
                    zoomControl: false,
                    attributionControl: false,
                    dragging: false,
                    touchZoom: false,
                    scrollWheelZoom: false,
                    doubleClickZoom: false,
                    boxZoom: false,
                    keyboard: false
                }).setView([lat, lon], 14);

                // Add tile layer with custom tiles
                L.tileLayer('/tiles/ump/{z}/{x}/{y}.png', {
                    maxZoom: 18,
                    minZoom: 5
                }).addTo(modalMap);

                // Add marker with custom icon
                modalMarker = L.marker([lat, lon], { icon: circleIcon }).addTo(modalMap);

                // Add click handler to map container to open OSM
                document.getElementById('modalMapContainer').addEventListener('click', openInOSM);
            }
        }

        function openInOSM() {
            if (currentPhotoCoords) {
                const { lat, lon } = currentPhotoCoords;
                const osmUrl = `https://www.openstreetmap.org/?mlat=${lat}&mlon=${lon}#map=15/${lat}/${lon}`;
                window.open(osmUrl, '_blank');
            }
        }

        function closeModal() {
            const modal = document.getElementById('modalOverlay');
            modal.classList.remove('visible');

            setTimeout(() => {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }, 300);

            currentModalIndex = -1;
        }

        function navigateModal(direction) {
            let newIndex = currentModalIndex + direction;

            // Find next valid photo
            while (newIndex >= 0 && newIndex < gridPhotos.length && !gridPhotos[newIndex]) {
                newIndex += direction;
            }

            if (newIndex >= 0 && newIndex < gridPhotos.length && gridPhotos[newIndex]) {
                openModal(newIndex);
            }
        }

        // Modal close on click outside
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modalOverlay')) {
                closeModal();
            }
        });

        // Modal keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (currentModalIndex === -1) return;

            switch (e.key) {
                case 'Escape':
                    closeModal();
                    break;
                case 'ArrowLeft':
                    navigateModal(-1);
                    break;
                case 'ArrowRight':
                    navigateModal(1);
                    break;
            }
        });

        // Modal swipe down to close (touch)
        document.getElementById('modalOverlay').addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        document.getElementById('modalOverlay').addEventListener('touchmove', (e) => {
            const touchY = e.touches[0].clientY;
            const deltaY = touchY - touchStartY;

            if (deltaY > 100) {
                closeModal();
            }
        });

        // ===== RESIZE HANDLER =====
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                buildGrid();
            }, 250);
        });

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadPhotos();
        });
    </script>
</body>
