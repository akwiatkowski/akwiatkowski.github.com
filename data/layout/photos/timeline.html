    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <button class="theme-toggle" onclick="toggleTheme()" title="Zmien motyw">
                <span class="theme-icon">☀️</span>
            </button>
        </header>

        <!-- Photo Grid -->
        <div class="grid-container" id="gridContainer">
            <div class="photo-grid" id="photoGrid">
                <!-- Photos will be inserted here -->
            </div>
        </div>

        <!-- Slider Section -->
        <div class="slider-section">
            <div class="slider-container">
                <input type="range" class="day-slider" id="daySlider" min="1" max="366" value="1">
                <div class="month-labels">
                    <span>Sty</span>
                    <span>Lut</span>
                    <span>Mar</span>
                    <span>Kwi</span>
                    <span>Maj</span>
                    <span>Cze</span>
                    <span>Lip</span>
                    <span>Sie</span>
                    <span>Wrz</span>
                    <span>Paz</span>
                    <span>Lis</span>
                    <span>Gru</span>
                </div>
                <div class="slider-info">
                    <span class="current-date" id="currentDate">01-01</span>
                    <span class="photo-stats" id="photoStats" style="color: var(--text-muted); font-size: 0.75rem; font-variant-numeric: tabular-nums;"></span>
                </div>
            </div>
        </div>

        <!-- Modal -->
        <div class="modal-overlay" id="modalOverlay">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <button class="modal-nav prev" onclick="navigateModal(-1)">&#8249;</button>
            <button class="modal-nav next" onclick="navigateModal(1)">&#8250;</button>
            <div class="modal-content">
                <div class="modal-image-container">
                    <img class="modal-image" id="modalImage" src="" alt="">
                </div>
                <!-- Caption overlay at bottom left -->
                <div class="modal-caption">
                    <div class="modal-caption-inner">
                        <div class="modal-date" id="modalDate"></div>
                        <div class="modal-desc" id="modalDesc"></div>
                        <a class="modal-link" id="modalLink" href="#" target="_blank">Zobacz wpis</a>
                        <div class="modal-exif" id="modalExif"></div>
                    </div>
                </div>
                <!-- Map in bottom right corner -->
                <div class="modal-map-container" id="modalMapContainer" title="Kliknij aby otworzyc w OpenStreetMap">
                    <div id="modalMap"></div>
                </div>
            </div>
        </div>

        <!-- Loading -->
        <div class="loading-spinner" id="loadingSpinner">Ladowanie zdjec...</div>
    </div>
