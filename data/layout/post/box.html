<div class="grid-item grid-item-post {{ klass }}" style="background-repeat: no-repeat; background-image: url('{{ post.card_image_url }}'); background-image: image-set(url('{{ post.card_image_url_avif }}') type('image/avif'), url('{{ post.card_image_url }}') type('image/jpeg'));">
  <h1><a href="{{ post.url }}">{{ post.title }}</a></h1>
  <h6 class="grid-item-date">{{ post.date }}</h6>

  <a href="{{ post.url }}"><img src="/img/blank.gif" class="blank-gif" alt="{{ post.title }}" /></a>

  <span class="grid-item-distance">{{ post.distance }}</span>
  <span class="grid-item-time-length">{{ post.time_length }}</span>
</div>
